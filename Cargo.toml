[workspace]
members = [
    "crates/redstone-core",
    "crates/redstone-java-26",
    "crates/redstone-io",
    "crates/redstone-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["azazo1"]

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
fastnbt = "2.6.0"
flate2 = "1.1.2"
indexmap = { version = "2.9.0", features = ["serde"] }
indicatif = "0.18.6"
libc = "0.2.186"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.8.23"
tracing = "0.1.41"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
